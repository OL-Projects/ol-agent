name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site's own rule, applied to the site: the published receipt must match
      # the bytes about to be served. A stale proof.json fails the deploy rather
      # than shipping a page that would report a mismatch to a visitor.
      - name: Verify the published receipt
        run: python3 proof.py --check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 300000
          error_count: 20
